[project]
name = "atomverse-backend"
version = "0.1.0"
description = "Atomverse FastAPI backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.141.1",
    "google-genai==2.25.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
build = [
    "chempy==0.10.2",
]
test = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "uv==0.12.19",
]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["."]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
# Generated bindings under app/generated are written by "npm run catalog:generate"
# in a byte-stable form, so the formatter must not rewrite them: regeneration and
# formatting would otherwise fight over the same bytes. They still pass "ruff check".
exclude = ["app/generated/**"]
